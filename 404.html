<style>
/* ═══════════════════════════════════════════════════════════════════════
   08/08 (patron : pages concurrents InterFast / Costructor / Khosmos / Stan
   + « faut garder le logo — noir ou blanc ? un truc simple et efficace ») —
   LA CONNEXION, carte scindee : panneau NOIR #1A1B1E (le logo du designer
   vit sur ce fond, il y est chez lui) + panneau BLANC (le formulaire, la
   ou on lit le mieux). C'est le motif des deux concurrents les plus pros
   (InterFast, Khosmos) — Stan et Costructor n'ont qu'une carte nue.
   Les TROIS ETATS de la maquette Authentication restent branches :
   1 · vide  ·  2 · erreur de champ  ·  3 · bandeau apres 5 echecs.
   La MECANIQUE ne change pas : Supabase (connexion + creation de compte),
   redirection si deja connecte, Entree pour valider, garde SB sans CDN.
   Version halo du 06/08 : git (rollback possible). ═══════════════════ */
:root{color-scheme:light only;
  --orange:#FF5A1F;--orange-deep:#EA4A10;--noir:#1A1B1E;--ink:#171A20;--ink2:#3D434E;--muted:#5B6172;
  /* ☠️ 09/09 (patron) : suite de l'harmonisation des fonds. AUDIT --line :
   CINQ valeurs. #EBECF1 (24 pages), #ECEDF1 (3), #E9EBF0 (2), #E8EAF0 et
   #E6E8EE. MESURE en clarte L* : tous les ecarts sont SOUS 1 — invisibles.
   Ce ne sont pas des choix, ce sont des fautes de frappe recopiees. On
   ramene tout le SaaS sur #EBECF1, la valeur des 24 autres pages.
   rapport-client.html garde le sien : page vue par le CLIENT, hors SaaS. */
  --line:#EBECF1;--champ:#FFFFFF;--green-d:#0F8A4F;--red:#D63B33;--red-bg:#FDECEA;--red-line:#F5C6C0}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{font-family:'Inter',sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;
  display:grid;place-items:center;padding:26px 16px;-webkit-font-smoothing:antialiased;
  /* ☠️ 09/09 (patron) : « maintenant tu dois choisir la couleur de fond
   partout ». AUDIT : le SaaS portait CINQ fonds de page. #F4F5F8 (23 pages,
   et la valeur du Figma Saigon), #F5F6F8 (4), #F5F6F9 (2), plus deux pages
   hors-SaaS. MESURE en clarte L* : entre les trois premiers l'ecart est de
   0,32 — sous le seuil du visible. Ce n'etaient pas trois choix de design,
   c'etait le meme gris tape trois fois. On garde #F4F5F8, celui de Saigon.
   NE PAS confondre avec « .tdrow:active{background:#F5F6F9} » : celui-la est
   l'etat « ligne pressee », identique sur les 26 pages qui l'ont. On n'y
   touche pas. */
  background:#F4F5F8;
  background-image:radial-gradient(circle at 50% 30%, rgba(255,90,31,.07), rgba(255,90,31,0) 52%)}

/* ── la carte scindee ── */
.duo{width:min(1000px,100%);display:grid;grid-template-columns:420px 1fr;border-radius:18px;
  overflow:hidden;background:#fff;box-shadow:0 30px 70px -30px rgba(23,26,32,.35)}

/* panneau gauche : le NOIR du logo — il se fond dedans, c'est voulu */
.brandp{background:var(--noir);color:#B9BDC7;display:flex;flex-direction:column;justify-content:center;
  padding:52px 42px;position:relative;overflow:hidden}
.brandp::after{content:"";position:absolute;left:-90px;bottom:-120px;width:320px;height:320px;
  border-radius:50%;background:radial-gradient(circle, rgba(255,90,31,.16), rgba(255,90,31,0) 70%)}
.brandp>*{position:relative}
.blogo{display:block;width:300px;max-width:100%;height:auto;margin:0 0 22px -6px}
.bline{font-size:.98rem;line-height:1.6;color:#C9CDD6;max-width:300px}
.bfeat{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:12px}
.bfeat li{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:600;color:#D7DAE0}
.bfeat svg{width:17px;height:17px;flex:none;fill:none;stroke:#fff;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}

/* panneau droit : le formulaire, sur BLANC */
.formp{padding:56px 60px 44px;display:flex;flex-direction:column;justify-content:center}
h1{font-family:'Sora';font-weight:800;font-size:1.14rem;letter-spacing:-.01em;margin-bottom:30px}
.sub{display:none;font-size:.75rem;color:var(--muted);margin:-14px 0 26px;line-height:1.5}

/* le bandeau « trop de tentatives » (etat 3 de la maquette) */
.warn{display:none;background:var(--red-bg);border:1px solid var(--red-line);border-radius:11px;
  padding:11px 12px;margin-bottom:14px;font-size:.76rem;color:var(--ink2);line-height:1.5;position:relative}
.warn.on{display:block}
.warn b{display:flex;align-items:center;gap:6px;color:var(--red);font-size:.78rem;margin-bottom:2px}
.warn b svg{width:14px;height:14px;fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round}
.warn .x{position:absolute;top:9px;right:10px;border:0;background:none;cursor:pointer;color:var(--muted);
  font-size:.9rem;line-height:1;padding:2px}

label{display:block;font-size:.72rem;font-weight:700;color:var(--ink2);margin:0 0 7px}
.fld{margin-bottom:22px}
/* ☠️ 09/09 (patron : « oui »). Les 8 pages du SaaS sont passees en champ
   BLANC + bordure. Ces deux champs-la etaient restes gris — ils avaient
   echappe a l'audit parce qu'ils passent par var(--champ) et non par une
   couleur ecrite en dur. MESURE : ecart de 3,49 en clarte avec le blanc,
   c'est le seul des ecarts trouves aujourd'hui qui SE VOIT. Et c'est le
   PREMIER ecran du produit.
   Le :focus juste en dessous mettait deja « background:#fff » : au clic,
   rien ne change desormais sauf la bordure qui passe au orange — soit
   exactement le comportement des 8 autres pages.
   --champ n'a plus d'usage apres ce changement ; je le laisse a #FFFFFF
   plutot que de le supprimer, pour qu'un usage qui m'aurait echappe rende
   du blanc et non une variable manquante. */
  .fld input{width:100%;border:1px solid var(--line);background:#FFFFFF;border-radius:9px;
  padding:12px 13px;font-size:.86rem;font-family:inherit;color:var(--ink);outline:none;transition:.13s}
.fld input::placeholder{color:#A2A8B4}
.fld input:focus{border-color:var(--orange);background:#fff}
.pwrap{position:relative}
.pwrap input{padding-right:40px}
.oeil{position:absolute;top:50%;right:9px;transform:translateY(-50%);border:0;background:none;cursor:pointer;
  padding:4px;color:var(--muted);display:grid;place-items:center}
.oeil svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* etat 2 de la maquette : le champ en faute */
.fld.ko input{border-color:var(--red);background:#fff}
.ferr{display:none;font-size:.7rem;color:var(--red);font-weight:600;margin-top:5px}
.fld.ko .ferr{display:block}

.go{width:100%;border:0;cursor:pointer;background:var(--orange);color:#fff;font-family:inherit;
  font-weight:700;font-size:.86rem;border-radius:9px;padding:13px;margin-top:16px;transition:.13s;
  box-shadow:0 10px 22px -10px rgba(234,74,16,.55)}
.go:hover{background:var(--orange-deep)}
.go:disabled{opacity:.6;cursor:default}

.lblrow{display:flex;justify-content:space-between;align-items:baseline}
.lblrow label{margin:0 0 8px}
.oubli{font-size:.73rem;font-weight:700;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.oubli:hover{text-decoration:underline}
.souv{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--ink2);margin:-6px 0 16px;cursor:pointer}
.souv input{width:15px;height:15px;accent-color:var(--green-d)}
.tech{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.78rem;color:var(--ink2);text-decoration:none}
.tech:hover{border-color:#C5C9D3}
.tech svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tech b{color:var(--ink)}
.alt{display:block;width:100%;text-align:center;border:0;background:none;cursor:pointer;font-family:inherit;
  margin-top:26px;font-size:.78rem;font-weight:600;color:var(--muted)}
.alt:hover{color:var(--ink2)}
.alt b{color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:3px}

.msg{display:none;font-size:.76rem;font-weight:600;margin-top:11px;line-height:1.5;text-align:center}
.msg.err{display:block;color:var(--red)}
.msg.ok{display:block;color:var(--green-d)}
.foot{margin-top:34px;font-size:.68rem;color:#9AA0AC;text-align:center}

/* ── telephone : le noir devient un bandeau compact au-dessus du formulaire ── */
.caps{display:none;margin-top:7px;font-size:.78rem;font-weight:700;color:#B45309;background:#FEF3C7;border-radius:7px;padding:5px 9px}.caps.on{display:inline-block}
@media (max-width:740px){
  body{padding:0}
  .duo{grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:100dvh;border-radius:0;box-shadow:none}
  .brandp{padding:34px 26px 28px;justify-content:flex-start;align-items:center;text-align:center}
  .blogo{width:218px;margin:0 auto 14px}
  .bline{max-width:300px;font-size:.78rem}
  .bfeat{display:none}
  .formp{padding:34px 24px 38px;justify-content:flex-start}
}
</style>
<style>
